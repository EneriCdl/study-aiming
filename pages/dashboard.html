<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Aiming - 学习概览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=20260610-achievements">
</head>
<body data-page="dashboard">
  <canvas id="particleCanvas"></canvas>
  <div class="page-shell">

  <div class="scroll-progress-bar">
    <div class="scroll-progress-fill"></div>
    <div class="scroll-progress-glow"></div>
  </div>

  <nav class="nav-bar">
    <div class="nav-logo">✦ Study Aiming</div>
    <div class="nav-links">
      <a href="../index.html" class="nav-link" data-page="home">首页</a>
      <a href="dashboard.html" class="nav-link active" data-page="dashboard">仪表盘</a>
      <a href="roadmap.html" class="nav-link" data-page="roadmap">路线图</a>
      <button class="nav-btn" id="btnSettings">⚙ 设置</button>
    </div>
  </nav>

  <section id="dashboard" class="section dashboard-section">
    <div class="dashboard-container">
      <div class="dashboard-left"></div>
      <div class="dashboard-right">
        <div class="plan-switcher" id="planSwitcher" style="display:none">
          <span class="plan-switcher-label">当前计划：</span>
          <select id="planSelector" class="plan-selector"></select>
        </div>

        <div class="dashboard-empty" id="dashboardEmpty">
          <div class="empty-icon">📭</div>
          <h3>暂无进行中的计划</h3>
          <p>创建或选择一个学习计划，开始你的学习之旅</p>
          <button class="btn btn-primary" id="btnGoToPlans">选择 / 创建学习计划</button>
        </div>

        <div class="dashboard-content" id="dashboardContent" style="display:none">
          <h2 class="section-title">学习概览</h2>

          <div class="stats-grid">
            <div class="stat-card glass-card">
              <div class="stat-icon">📚</div>
              <div class="stat-info">
                <span class="stat-value" id="statTotalTasks">0</span>
                <span class="stat-label">总任务数</span>
              </div>
            </div>
            <div class="stat-card glass-card">
              <div class="stat-icon">✅</div>
              <div class="stat-info">
                <span class="stat-value" id="statCompleted">0</span>
                <span class="stat-label">已完成</span>
              </div>
            </div>
            <div class="stat-card glass-card">
              <div class="stat-icon"><span id="streakIcon">🔥</span></div>
              <div class="stat-info">
                <span class="stat-value" id="statStreak">0</span>
                <span class="stat-label">连续天数</span>
              </div>
            </div>
            <div class="stat-card glass-card">
              <div class="stat-icon" id="stageIcon">⭐</div>
              <div class="stat-info">
                <span class="stat-value" id="statStage">入门阶段</span>
                <span class="stat-label">当前阶段</span>
              </div>
            </div>
          </div>

          <div class="progress-section glass-card">
            <h3>当前学习进度</h3>
            <div class="progress-bar-container">
              <div class="progress-bar-fill" id="mainProgressFill"></div>
              <span class="progress-text" id="mainProgressText">0%</span>
            </div>
            <p class="current-task" id="currentTask">暂无学习任务</p>
          </div>

          <div class="tasks-section glass-card">
            <div class="tasks-header">
              <h3>📋 学习任务</h3>
              <button class="btn btn-sm btn-accent" id="btnAddTask">+ 添加任务</button>
            </div>
            <div class="task-input-row" id="taskInputRow" style="display:none">
              <input type="text" id="taskInput" placeholder="输入任务标题，回车确认" maxlength="100">
              <button class="btn btn-sm btn-primary" id="btnConfirmTask">添加</button>
              <button class="btn btn-sm" id="btnCancelTask">取消</button>
            </div>
            <div class="task-list" id="taskList">
              <div class="task-empty">暂无任务，点击「+ 添加任务」开始</div>
            </div>
          </div>
        </div>

        <div class="heatmap-section glass-card">
          <h3>月度学习热力图</h3>
          <div class="heatmap-container" id="heatmapContainer">
            <div class="heatmap-labels">
              <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
            </div>
            <div class="heatmap-grid" id="heatmapGrid"></div>
          </div>
          <div class="heatmap-legend">
            <span>少</span>
            <div class="legend-box" style="opacity:0.2"></div>
            <div class="legend-box" style="opacity:0.4"></div>
            <div class="legend-box" style="opacity:0.6"></div>
            <div class="legend-box" style="opacity:0.8"></div>
            <div class="legend-box" style="opacity:1"></div>
            <span>多</span>
          </div>
        </div>

        <div class="achievement-section glass-card">
          <div class="achievement-header">
            <h3>成就徽章墙</h3>
            <span class="achievement-summary" id="achievementSummary">0/4</span>
          </div>
          <div class="achievement-grid" id="achievementGrid"></div>
        </div>
      </div>
    </div>
    <a href="roadmap.html" class="scroll-hint page-next-link" data-page="roadmap">
      <span>继续查看学习路线</span>
      <div class="scroll-arrow"></div>
    </a>
  </section>

  </div>
  <div class="modal-overlay" id="settingsModal">
    <div class="modal glass-card">
      <div class="modal-header">
        <h3>API 设置</h3>
        <button class="modal-close" id="closeSettings">&times;</button>
      </div>
      <div class="modal-body">
        <div class="api-status-bar" id="apiStatusBar">
          <span class="api-status-dot" id="apiStatusDot"></span>
          <span id="apiStatusText">未连接</span>
        </div>
        <div class="form-group">
          <label>AI 服务提供商</label>
          <select id="apiProvider">
            <option value="openai">OpenAI</option>
            <option value="deepseek">DeepSeek</option>
            <option value="claude">Claude (Anthropic)</option>
            <option value="gemini">Gemini (Google)</option>
            <option value="xiaomi_mimo">Xiaomi MiMo</option>
            <option value="qwen">通义千问 (Qwen)</option>
            <option value="zhipu">智谱 (GLM)</option>
            <option value="custom">自定义（兼容 OpenAI）</option>
          </select>
        </div>
        <div class="form-group" id="customEndpointGroup" style="display:none">
          <label>API 端点</label>
          <input type="text" id="apiEndpoint" placeholder="https://api.example.com/v1/chat/completions">
        </div>
        <div class="form-group">
          <label>API Key</label>
          <input type="password" id="apiKey" placeholder="sk-...">
          <small>密钥仅存储在本地浏览器中</small>
        </div>
        <div class="form-group">
          <label>模型名称</label>
          <input type="text" id="modelName" list="modelPresetList" placeholder="选择或输入模型名称">
          <datalist id="modelPresetList"></datalist>
        </div>
        <div class="settings-actions">
          <button class="btn btn-primary" id="btnSaveSettings">保存并验证</button>
          <button class="btn btn-accent" id="btnTestApi" style="display:none">测试连接</button>
        </div>
        <div class="settings-security-note">
          <span class="security-icon">🔒</span>
          <span>密钥仅存在本地浏览器中，不会上传至任何服务器</span>
        </div>
        <div class="divider"></div>
        <button class="btn btn-outline btn-danger" id="btnResetAll">🗑 重置所有数据</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="../js/particles.js?v=20260610-achievements"></script>
  <script src="../js/app.js?v=20260610-achievements"></script>
</body>
</html>
