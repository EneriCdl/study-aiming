<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Aiming - 学习路线图</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=20260610-achievements">
</head>
<body data-page="roadmap">
  <canvas id="particleCanvas"></canvas>

  <div class="scroll-progress-bar">
    <div class="scroll-progress-fill"></div>
    <div class="scroll-progress-glow"></div>
  </div>

  <nav class="nav-bar">
    <div class="nav-logo">✦ Study Aiming</div>
    <div class="nav-links">
      <a href="../index.html" class="nav-link" data-page="home">首页</a>
      <a href="dashboard.html" class="nav-link" data-page="dashboard">仪表盘</a>
      <a href="roadmap.html" class="nav-link active" data-page="roadmap">路线图</a>
      <button class="nav-btn" id="btnSettings">⚙ 设置</button>
    </div>
  </nav>

  <section id="roadmap" class="section roadmap-section">
    <div id="planGallery" class="plan-gallery">
      <div class="gallery-header">
        <h2 class="section-title">我的学习计划</h2>
        <div class="gallery-actions">
          <button class="btn btn-primary" id="btnNewPlan">✦ 生成新计划</button>
          <button class="btn btn-outline" id="btnImportPlan">📄 导入文档</button>
        </div>
      </div>
      <div class="plan-grid" id="planGrid"></div>
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🚀</div>
        <h3>还没有学习计划</h3>
        <p>点击上方按钮，AI 帮你生成专属学习路线</p>
      </div>
    </div>

    <div id="planDetail" class="plan-detail" style="display:none">
      <div class="detail-header">
        <button class="btn btn-outline" id="btnBackToList">← 返回计划列表</button>
        <button class="btn btn-danger btn-sm" id="btnDeletePlan">🗑 删除此计划</button>
      </div>
      <div class="detail-hero" id="detailHero"></div>
      <div class="detail-timeline" id="detailTimeline"></div>
    </div>
  </section>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal glass-card">
      <div class="modal-header">
        <h3>API 设置</h3>
        <button class="modal-close" id="closeSettings">&times;</button>
      </div>
      <div class="modal-body">
        <div class="api-status-bar" id="apiStatusBar">
          <span class="api-status-dot" id="apiStatusDot"></span>
          <span id="apiStatusText">未连接</span>
        </div>
        <div class="form-group">
          <label>AI 服务提供商</label>
          <select id="apiProvider">
            <option value="openai">OpenAI</option>
            <option value="deepseek">DeepSeek</option>
            <option value="claude">Claude (Anthropic)</option>
            <option value="gemini">Gemini (Google)</option>
            <option value="xiaomi_mimo">Xiaomi MiMo</option>
            <option value="qwen">通义千问 (Qwen)</option>
            <option value="zhipu">智谱 (GLM)</option>
            <option value="custom">自定义（兼容 OpenAI）</option>
          </select>
        </div>
        <div class="form-group" id="customEndpointGroup" style="display:none">
          <label>API 端点</label>
          <input type="text" id="apiEndpoint" placeholder="https://api.example.com/v1/chat/completions">
        </div>
        <div class="form-group">
          <label>API Key</label>
          <input type="password" id="apiKey" placeholder="sk-...">
          <small>密钥仅存储在本地浏览器中</small>
        </div>
        <div class="form-group">
          <label>模型名称</label>
          <input type="text" id="modelName" list="modelPresetList" placeholder="选择或输入模型名称">
          <datalist id="modelPresetList"></datalist>
        </div>
        <div class="settings-actions">
          <button class="btn btn-primary" id="btnSaveSettings">保存并验证</button>
          <button class="btn btn-accent" id="btnTestApi" style="display:none">测试连接</button>
        </div>
        <div class="settings-security-note">
          <span class="security-icon">🔒</span>
          <span>密钥仅存在本地浏览器中，不会上传至任何服务器</span>
        </div>
        <div class="divider"></div>
        <button class="btn btn-outline btn-danger" id="btnResetAll">🗑 重置所有数据</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="createModal">
    <div class="modal glass-card modal-large">
      <div class="modal-header">
        <h3>创建学习路线</h3>
        <button class="modal-close" id="closeCreate">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>学习内容 *</label>
          <input type="text" id="learnTopic" placeholder="例如：Python 编程、线性代数、机器学习...">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>当前水平</label>
            <select id="currentLevel">
              <option value="零基础">零基础</option>
              <option value="入门">入门</option>
              <option value="中级">中级</option>
              <option value="高级">高级</option>
            </select>
          </div>
          <div class="form-group">
            <label>目标水平</label>
            <select id="targetLevel">
              <option value="入门">入门</option>
              <option value="中级" selected>中级</option>
              <option value="高级">高级</option>
              <option value="精通">精通</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>每日可投入时间</label>
            <select id="dailyHours">
              <option value="0.5">30 分钟</option>
              <option value="1" selected>1 小时</option>
              <option value="2">2 小时</option>
              <option value="3">3 小时</option>
              <option value="4">4 小时以上</option>
            </select>
          </div>
          <div class="form-group">
            <label>时间紧迫程度</label>
            <select id="urgency">
              <option value="relaxed">剩余时间很多</option>
              <option value="normal" selected>时间适中</option>
              <option value="urgent">比较紧迫</option>
              <option value="critical">非常紧迫</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>补充说明（可选）</label>
          <textarea id="extraInfo" placeholder="例如：希望侧重实践项目、有特定的时间节点要求..."></textarea>
        </div>
        <div class="ai-status" id="aiStatus"></div>
        <button class="btn btn-primary btn-full" id="btnGenerateRoadmap">
          <span class="btn-text">✦ AI 生成学习路线</span>
          <span class="btn-loading" style="display:none">正在规划中...</span>
        </button>
        <div class="generate-progress" id="generateProgress" style="display:none">
          <div class="generate-progress-header">
            <span class="generate-progress-label" id="progressLabel">正在分析学习目标...</span>
            <span class="generate-progress-pct" id="progressPct">0%</span>
          </div>
          <div class="generate-progress-track">
            <div class="generate-progress-fill" id="progressFill"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="importModal">
    <div class="modal glass-card">
      <div class="modal-header">
        <h3>导入学习文档</h3>
        <button class="modal-close" id="closeImport">&times;</button>
      </div>
      <div class="modal-body">
        <div class="upload-area" id="uploadArea">
          <div class="upload-icon">📄</div>
          <p>拖拽文件到此处或点击选择</p>
          <small>支持 .docx, .txt, .json 格式</small>
          <input type="file" id="fileInput" accept=".docx,.txt,.json" style="display:none">
        </div>
        <div class="import-preview" id="importPreview" style="display:none">
          <h4>预览导入内容</h4>
          <div class="preview-content" id="previewContent"></div>
          <button class="btn btn-primary btn-full" id="btnConfirmImport">确认导入</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="editPlanModal">
    <div class="modal glass-card">
      <div class="modal-header">
        <h3>编辑学习计划</h3>
        <button class="modal-close" id="closeEditPlan">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>图标</label>
          <input type="text" id="editPlanIcon" maxlength="4" placeholder="例如：📘">
        </div>
        <div class="form-group">
          <label>计划名称 *</label>
          <input type="text" id="editPlanTitle" maxlength="80" placeholder="输入计划名称">
        </div>
        <div class="form-group">
          <label>简介</label>
          <textarea id="editPlanDescription" maxlength="160" placeholder="输入计划简介"></textarea>
        </div>
        <button class="btn btn-primary btn-full" id="btnSavePlanEdit">保存修改</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
  <script src="../js/particles.js?v=20260610-achievements"></script>
  <script src="../js/app.js?v=20260610-achievements"></script>
</body>
</html>
